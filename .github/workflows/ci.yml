name: omega-zero-trust-ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, "autofix/**"]

permissions:
  contents: read

concurrency:
  group: omega-zero-trust-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - name: Fetch exact event commit without third-party actions
        shell: bash
        run: |
          set -euo pipefail
          git init .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git -c protocol.version=2 fetch --no-tags --depth=1 origin "${GITHUB_SHA}"
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"

      - name: Verify interpreter
        run: python3 --version

      - name: Run adversarial unit tests
        run: python3 -m unittest discover -v

      - name: Compile bytecode
        run: python3 -m py_compile omega_compiler.py test_omega_compiler.py
